name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Runner environment
        run: |
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          ls /Applications | grep -i xcode || echo "No Xcode entries in /Applications"
          which xcodebuild && xcodebuild -version || echo "xcodebuild not in PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: List project schemes
        run: xcodebuild -list -project Aidea/Aidea.xcodeproj

      - name: Build
        run: |
          xcodebuild \
            -project Aidea/Aidea.xcodeproj \
            -scheme Aidea \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Test
    runs-on: macos-15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          xcodebuild \
            -project Aidea/Aidea.xcodeproj \
            -scheme Aidea \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:AideaUITests \
            test
