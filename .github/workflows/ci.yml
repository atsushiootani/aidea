name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Runner info
        run: |
          echo "OS=$RUNNER_OS ARCH=$RUNNER_ARCH"
          xcodebuild -version 2>&1 || echo "xcodebuild not found"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project Aidea/Aidea.xcodeproj \
            -scheme Aidea \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Test
    runs-on: macos-15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          xcodebuild \
            -project Aidea/Aidea.xcodeproj \
            -scheme Aidea \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:AideaUITests \
            test
